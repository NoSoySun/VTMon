plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = rootProject.mod_version
group = rootProject.maven_group

def fabricJavaDir = rootProject.layout.projectDirectory.dir('src/fabric/java')
def sharedResourcesDir = rootProject.layout.projectDirectory.dir('src/main/resources')
def fabricResourcesDir = rootProject.layout.projectDirectory.dir('src/fabric/resources')

base {
	archivesName = "${rootProject.archives_base_name}-fabric"
}

sourceSets {
	main {
		java.srcDir fabricJavaDir
		resources {
			srcDir sharedResourcesDir
			srcDir fabricResourcesDir
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
	mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

	modImplementation "curse.maven:cobblemon-687131:7553235"
	modImplementation "curse.maven:cobblemon-mega-showdown-1189523:7633965"

	modImplementation "net.fabricmc:fabric-language-kotlin:1.13.7+kotlin.2.2.21"
	modImplementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
	modImplementation "org.jetbrains.kotlin:kotlin-reflect:1.9.24"

	modImplementation "io.wispforest:owo-lib:0.12.15.4+1.21"
	modImplementation "curse.maven:accessories-938917:7046412"
	modImplementation "curse.maven:architectury-api-419699:5786326"
	modImplementation "io.wispforest:endec:0.1.3"
}

fabricApi {
	configureDataGeneration { client = true }
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName
	from(rootProject.file("LICENSE")) {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifactId = project.base.archivesName.get()
			from components.java
		}
	}
}
